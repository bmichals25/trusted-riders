name: Netlify draft preview

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: netlify-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      statuses: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dispatch/package-lock.json

      - name: Require Netlify auth
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "NETLIFY_AUTH_TOKEN is not set on this repo. Cannot create a deploy preview."
            exit 1
          fi

      - name: Deploy draft preview (never production)
        id: deploy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || 1 }}
        run: |
          set -euo pipefail
          SITE="${NETLIFY_SITE_ID:-trustedriders-dispatch}"
          ALIAS="deploy-preview-${PR_NUMBER}"
          npx --yes netlify-cli deploy \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --site "$SITE" \
            --build \
            --alias "$ALIAS" \
            --message "PR ${PR_NUMBER} draft preview (not production) ${GITHUB_SHA}" \
            --json > /tmp/netlify-deploy.json
          node <<'NODE'
          const fs = require("fs");
          const d = JSON.parse(fs.readFileSync("/tmp/netlify-deploy.json", "utf8"));
          const url = d.deploy_ssl_url || d.deploy_url || d.url;
          if (!url) {
            console.error("Netlify deploy JSON missing URL");
            process.exit(1);
          }
          console.log("Preview URL:", url);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          NODE

      - name: Record GitHub deployment
        if: steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'preview',
              auto_merge: false,
              required_contexts: [],
              description: 'Netlify draft preview (not production)',
              transient_environment: true,
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: url,
              log_url: url,
              description: 'Draft preview is up. Do not merge. Do not deploy production.',
            });
