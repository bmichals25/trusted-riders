# Dispatch UI host only. Do not treat this as the fleet/MCP backend.
# Existing Netlify UI build settings stay in effect when this file is used
# as the site base (typically the `dispatch/` directory).

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/health/"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/mcp/"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true
